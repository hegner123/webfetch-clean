<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vue.js App</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app"></div>

    <script>
        // Simulating Vue.js app data
        const appState = {
            article: {
                title: "Building Reactive UIs with Vue.js",
                author: "John Smith",
                date: "January 14, 2026",
                sections: [
                    {
                        heading: "1. Understanding Reactivity",
                        content: "At the core of Vue.js is its reactivity system. When you modify data, Vue automatically updates the DOM. This declarative approach makes your code more predictable and easier to reason about."
                    },
                    {
                        heading: "2. Composition API",
                        content: "The Composition API allows you to organize component logic by feature rather than by option type. Use ref() and reactive() to create reactive state, and computed() for derived state."
                    },
                    {
                        heading: "3. Component Communication",
                        content: "Props and emits provide a clear communication pattern between parent and child components. For more complex state, consider using Pinia for state management."
                    },
                    {
                        heading: "4. Lifecycle Hooks",
                        content: "Vue 3 lifecycle hooks like onMounted, onUpdated, and onUnmounted let you run code at specific points in a component's lifecycle."
                    },
                    {
                        heading: "5. Template Refs",
                        content: "Access DOM elements directly using template refs. This is useful for integrating with third-party libraries or implementing custom directives."
                    }
                ]
            }
        };

        // Simulating Vue app mounting
        window.addEventListener('DOMContentLoaded', function() {
            const app = document.getElementById('app');

            let sectionsHtml = '';
            appState.article.sections.forEach(section => {
                sectionsHtml += `
                    <h2>${section.heading}</h2>
                    <p>${section.content}</p>
                `;
            });

            app.innerHTML = `
                <div class="vue-app" data-v-app>
                    <header class="header" data-v-header>
                        <nav>
                            <a href="/">Home</a>
                            <a href="/articles">Articles</a>
                            <a href="/guides">Guides</a>
                            <a href="/about">About</a>
                        </nav>
                    </header>

                    <main class="main-content" data-v-main>
                        <div class="breadcrumb" data-v-breadcrumb>
                            <a href="/">Home</a> / <a href="/articles">Articles</a> / ${appState.article.title}
                        </div>

                        <article class="article" data-v-article>
                            <header>
                                <h1>${appState.article.title}</h1>
                                <div class="meta">
                                    <span>${appState.article.author}</span>
                                    <span>${appState.article.date}</span>
                                </div>
                            </header>

                            <div class="content">
                                <p class="intro">Vue.js 3 introduces powerful new features for building reactive user interfaces. The Composition API provides better code organization and reusability.</p>
                                ${sectionsHtml}
                                <h2>Conclusion</h2>
                                <p>Vue.js 3 provides a powerful, flexible foundation for building modern web applications. The Composition API, improved TypeScript support, and better performance make it an excellent choice.</p>
                            </div>
                        </article>

                        <aside class="sidebar" data-v-sidebar>
                            <div class="widget">
                                <h3>Related Articles</h3>
                                <ul>
                                    <li><a href="/pinia">State Management with Pinia</a></li>
                                    <li><a href="/router">Vue Router Deep Dive</a></li>
                                    <li><a href="/vite">Setting Up Vite</a></li>
                                </ul>
                            </div>
                        </aside>
                    </main>

                    <footer class="footer" data-v-footer>
                        <p>© 2026 VueBlog. All rights reserved.</p>
                    </footer>
                </div>
            `;
        });
    </script>

    <script src="/js/chunk-vendors.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
