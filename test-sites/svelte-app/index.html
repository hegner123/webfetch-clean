<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Svelte App</title>
    <link rel="stylesheet" href="/build/bundle.css">
</head>
<body>
    <script>
        // Simulating Svelte component data
        const articleData = {
            title: "Svelte: A Different Approach to Building UIs",
            author: "Sarah Johnson",
            date: "January 14, 2026",
            intro: "Svelte takes a fundamentally different approach to building user interfaces. Instead of doing work in the browser, Svelte shifts that work into a compile step that happens when you build your app.",
            sections: [
                {
                    id: 1,
                    heading: "1. Compile-Time Framework",
                    content: "Unlike React or Vue, Svelte is a compiler that converts your declarative components into efficient imperative code at build time. This means no virtual DOM and smaller bundle sizes."
                },
                {
                    id: 2,
                    heading: "2. Reactive Assignments",
                    content: "Svelte's reactivity is built on simple assignments. When you change a variable, Svelte automatically updates the DOM. No hooks, no special syntax - just JavaScript."
                },
                {
                    id: 3,
                    heading: "3. Scoped Styles",
                    content: "Styles in Svelte components are scoped by default. No need for CSS-in-JS libraries or naming conventions - styles just work without conflicts."
                },
                {
                    id: 4,
                    heading: "4. Built-in Animations",
                    content: "Svelte includes powerful animation and transition primitives out of the box. Create smooth, performant animations without external libraries."
                },
                {
                    id: 5,
                    heading: "5. Stores for State Management",
                    content: "Svelte stores provide a simple, reactive way to share state across components. Writable, readable, and derived stores cover most use cases elegantly."
                }
            ],
            conclusion: "Svelte's compile-time approach results in highly optimized, fast applications with less boilerplate. It's an excellent choice for developers who want simplicity without sacrificing performance."
        };

        // Simulating Svelte component mounting
        window.addEventListener('DOMContentLoaded', function() {
            const body = document.body;

            let sectionsHtml = '';
            articleData.sections.forEach(section => {
                sectionsHtml += `
                    <section class="svelte-section" data-svelte-id="${section.id}">
                        <h2>${section.heading}</h2>
                        <p>${section.content}</p>
                    </section>
                `;
            });

            body.innerHTML = `
                <div class="svelte-app">
                    <header class="svelte-header">
                        <nav class="svelte-nav">
                            <div class="logo">
                                <span>SvelteBlog</span>
                            </div>
                            <div class="nav-links">
                                <a href="/">Home</a>
                                <a href="/articles">Articles</a>
                                <a href="/docs">Docs</a>
                                <a href="/about">About</a>
                            </div>
                        </nav>
                    </header>

                    <main class="svelte-main">
                        <div class="container">
                            <nav class="breadcrumb-nav" aria-label="breadcrumb">
                                <a href="/">Home</a>
                                <span>/</span>
                                <a href="/articles">Articles</a>
                                <span>/</span>
                                <span>${articleData.title}</span>
                            </nav>

                            <article class="svelte-article">
                                <header class="article-header">
                                    <h1>${articleData.title}</h1>
                                    <div class="article-meta">
                                        <span class="author">By ${articleData.author}</span>
                                        <span class="date">${articleData.date}</span>
                                        <span class="read-time">7 min read</span>
                                    </div>
                                    <div class="share-buttons">
                                        <button class="share-btn">Share on Twitter</button>
                                        <button class="share-btn">Share on LinkedIn</button>
                                    </div>
                                </header>

                                <div class="article-body">
                                    <p class="intro">${articleData.intro}</p>

                                    ${sectionsHtml}

                                    <section class="conclusion">
                                        <h2>Conclusion</h2>
                                        <p>${articleData.conclusion}</p>
                                    </section>
                                </div>

                                <footer class="article-footer">
                                    <div class="tags">
                                        <span class="tag">Svelte</span>
                                        <span class="tag">Compiler</span>
                                        <span class="tag">Reactivity</span>
                                        <span class="tag">Performance</span>
                                    </div>
                                </footer>
                            </article>

                            <aside class="svelte-sidebar">
                                <div class="sidebar-widget">
                                    <h3>Related Posts</h3>
                                    <ul>
                                        <li><a href="/sveltekit">Getting Started with SvelteKit</a></li>
                                        <li><a href="/stores">Svelte Stores Deep Dive</a></li>
                                        <li><a href="/transitions">Animations and Transitions</a></li>
                                    </ul>
                                </div>

                                <div class="sidebar-widget newsletter">
                                    <h3>Newsletter</h3>
                                    <p>Get the latest Svelte tutorials in your inbox.</p>
                                    <form>
                                        <input type="email" placeholder="Your email">
                                        <button type="submit">Subscribe</button>
                                    </form>
                                </div>
                            </aside>
                        </div>
                    </main>

                    <footer class="svelte-footer">
                        <div class="footer-content">
                            <div class="footer-section">
                                <h4>SvelteBlog</h4>
                                <p>Learn Svelte through practical tutorials</p>
                            </div>
                            <div class="footer-section">
                                <h4>Resources</h4>
                                <nav>
                                    <a href="/tutorials">Tutorials</a>
                                    <a href="/examples">Examples</a>
                                    <a href="/api">API Docs</a>
                                </nav>
                            </div>
                            <div class="footer-section">
                                <h4>Community</h4>
                                <div class="social">
                                    <a href="https://twitter.com/svelteblog">Twitter</a>
                                    <a href="https://github.com/svelteblog">GitHub</a>
                                    <a href="https://discord.gg/svelte">Discord</a>
                                </div>
                            </div>
                        </div>
                        <div class="footer-bottom">
                            <p>© 2026 SvelteBlog. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            `;
        });
    </script>

    <script defer src="/build/bundle.js"></script>
</body>
</html>
